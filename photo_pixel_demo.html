  <h1>真实照片 → 像素信息 → ImageData 写回</h1>
  <p>左边是把上传的原图解码出真实像素矩阵后，用 <code>ctx.putImageData()</code> 逐像素写出来的结果（数据全部来自真实照片，不是算出来的）。
  右边几个按钮是对同一份真实像素数据做逐像素的数值处理，处理完依然用 ImageData 写回——能看出"真实感"来自数据本身，不是写入这个动作。</p>

    <button onclick="render('identity')">原样还原</button>
    <button onclick="render('grayscale')">逐像素转灰度</button>
    <button onclick="render('invert')">逐像素反色</button>
    <button onclick="render('threshold')">逐像素二值化</button>
    <button onclick="render('channelshift')">逐像素通道错位</button>

<script>
const img = document.getElementById('srcImg');
const outCanvas = document.getElementById('outCanvas');
const outCtx = outCanvas.getContext('2d');

let sourceImageData = null; // 真实像素数据只读取一次，缓存起来

img.onload = () => {
  const W = img.naturalWidth, H = img.naturalHeight;
  outCanvas.width = W;
  outCanvas.height = H;

  // 用一个临时 canvas 把图片解码成像素数组 —— 这一步是"把图片转成信息"
  const tmp = document.createElement('canvas');
  tmp.width = W; tmp.height = H;
  const tmpCtx = tmp.getContext('2d');
  tmpCtx.drawImage(img, 0, 0, W, H);
  sourceImageData = tmpCtx.getImageData(0, 0, W, H);
  // sourceImageData.data 就是一个 Uint8ClampedArray:
  // [R,G,B,A, R,G,B,A, ...] 每4个字节一个像素，长度 = W*H*4
  // 这就是这张照片"所有像素点的完整信息"

  document.getElementById('info').textContent =
    `图片尺寸 ${W}x${H}，共 ${W*H} 个像素，` +
    `像素数组长度 ${sourceImageData.data.length} 字节（每像素4字节 RGBA）`;

  render('identity');
};

function render(mode) {
  const t0 = performance.now();
  const W = sourceImageData.width, H = sourceImageData.height;

  // 每次都从原始真实像素数据复制一份，不污染缓存
  const src = sourceImageData.data;
  const out = outCtx.createImageData(W, H);
  const data = out.data;

  if (mode === 'identity') {
    // 原样复制：这是最直接的证明——数据是真实的，写出来就是真实的照片
    for (let i = 0; i < src.length; i++) data[i] = src[i];

  } else if (mode === 'grayscale') {
    for (let i = 0; i < src.length; i += 4) {
      const r = src[i], g = src[i+1], b = src[i+2];
      const gray = 0.299*r + 0.587*g + 0.114*b; // 亮度公式，逐像素算
      data[i] = data[i+1] = data[i+2] = gray;
      data[i+3] = src[i+3];
    }

  } else if (mode === 'invert') {
    for (let i = 0; i < src.length; i += 4) {
      data[i]   = 255 - src[i];
      data[i+1] = 255 - src[i+1];
      data[i+2] = 255 - src[i+2];
      data[i+3] = src[i+3];
    }

  } else if (mode === 'threshold') {
    for (let i = 0; i < src.length; i += 4) {
      const gray = 0.299*src[i] + 0.587*src[i+1] + 0.114*src[i+2];
      const v = gray > 128 ? 255 : 0;
      data[i] = data[i+1] = data[i+2] = v;
      data[i+3] = src[i+3];
    }

  } else if (mode === 'channelshift') {
    // 把 R/G/B 三个通道错开几个像素，制造color-fringe效果
    const shift = 6;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = (y*W + x) * 4;
        const rx = Math.min(W-1, x + shift);
        const bx = Math.max(0, x - shift);
        const ri = (y*W + rx) * 4;
        const bi = (y*W + bx) * 4;
        data[i]   = src[ri];     // R 通道来自右移采样
        data[i+1] = src[i+1];    // G 通道不变
        data[i+2] = src[bi+2];   // B 通道来自左移采样
        data[i+3] = src[i+3];
      }
    }

  } else if (mode === 'pixelate') {
    const block = 8;
    for (let by = 0; by < H; by += block) {
      for (let bx = 0; bx < W; bx += block) {
        let r=0,g=0,b=0,count=0;
        for (let y = by; y < Math.min(by+block, H); y++) {
          for (let x = bx; x < Math.min(bx+block, W); x++) {
            const i = (y*W + x) * 4;
            r += src[i]; g += src[i+1]; b += src[i+2];
            count++;
          }
        }
        r = Math.round(r/count); g = Math.round(g/count); b = Math.round(b/count);
        for (let y = by; y < Math.min(by+block, H); y++) {
          for (let x = bx; x < Math.min(bx+block, W); x++) {
            const i = (y*W + x) * 4;
            data[i] = r; data[i+1] = g; data[i+2] = b; data[i+3] = 255;
          }
        }
      }
    }
  }

  outCtx.putImageData(out, 0, 0);
  const t1 = performance.now();
  document.getElementById('info').textContent =
    `模式: ${mode} · 处理 ${W}x${H} = ${W*H} 个像素 · 耗时 ${(t1-t0).toFixed(1)}ms · 数据源: 真实照片像素`;
}
</script>
</body>
